[project]
name = "backend"
version = "0.1.0"
description = "API de l'agent IA d'aide aux ouvertures d'échecs"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chess>=1.11.2",
    "fastapi>=0.143.0",
    "langchain-google-genai>=4.4.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "pymilvus>=3.0.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "stockfish>=5.2.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

# torch en CPU : le modèle d'embedding tourne très bien sans GPU,
# et ça évite plusieurs Go de bibliothèques CUDA dans l'image Docker
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
