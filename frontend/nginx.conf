server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels à l'API sont transmis au backend, comme le fait proxy.conf.json avec ng serve.
    # Sans chemin après le port, nginx transmet l'adresse telle quelle (la FEN reste encodée)
    location /api/ {
        proxy_pass http://backend:8000;
        # Une première explication peut attendre Gemini une trentaine de secondes
        proxy_read_timeout 120s;
    }

    # Application Angular sur une seule page : toute autre adresse renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
